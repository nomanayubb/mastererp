[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ueos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "pyotp>=2.9",
  "email-validator>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4", "mypy>=1.10", "ruff>=0.5", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ueos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110

[tool.importlinter]
root_package = "ueos"

[[tool.importlinter.contracts]]
name = "platform must not depend on apps"
type = "forbidden"
source_modules = ["ueos.platform"]
forbidden_modules = ["ueos.apps"]
